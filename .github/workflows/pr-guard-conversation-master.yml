name: PR - Guard Master Base Branch

# Warns on PRs that target master, since merging there triggers a production
# deployment (see deploy.yml). Posts a review comment anchored to a line in
# the diff — an actual resolvable "conversation," not a plain PR comment —
# so it can be gated by branch protection.
#
# REQUIRES: "Require conversation resolution before merging" enabled in
# master's branch protection rule/ruleset (Settings -> Branches, or
# Settings -> Rules -> Rulesets). This workflow only posts the comment; it
# doesn't block the merge button itself, that's what the branch protection
# setting does.
#
# Known legitimate direct-to-master sources are skipped: the infra
# automation bot's hotfix PRs, and the manual staging -> master promotion.

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-guard-master-base-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard-master:
    if: ${{ github.event.pull_request.base.ref == 'master' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Warn on PRs targeting master
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Known legitimate cases that are allowed to target master directly.
          # Tighten the staging check further (e.g. an explicit release-manager
          # team allowlist) if a plain head-branch-name match proves too loose.
          if [[ "${PR_AUTHOR}" == "watchwire-infra-authentication[bot]" ]]; then
            echo "PR #${PR_NUMBER} opened by the infra automation bot; no warning needed."
            exit 0
          fi

          if [[ "${HEAD_REF}" == "staging" ]]; then
            echo "PR #${PR_NUMBER} is the staging -> master promotion; no warning needed."
            exit 0
          fi

          BODY="This PR targets \`master\`, which triggers a **production deployment** on merge (see deploy.yml). Please confirm this is intentional — if you meant \`qa\`, \`staging\`, or \`testing\` instead, update the base branch. Resolve this conversation once you've confirmed."

          echo "Fetching changed files to anchor a resolvable review comment..."
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate > /tmp/pr_files.json

          ANCHOR="$(python3 - <<'PY'
          import json

          with open("/tmp/pr_files.json") as f:
              files = json.load(f)

          def first_added_line(patch):
              # Walk the unified diff hunks, tracking the line number in the NEW
              # (right-hand) file, and return the first genuinely added line —
              # i.e. a line valid to anchor a review comment to.
              new_line = None
              for line in patch.splitlines():
                  if line.startswith("@@"):
                      plus_part = line.split("+", 1)[1].split("@@")[0].strip()
                      new_line = int(plus_part.split(",")[0])
                      continue
                  if new_line is None:
                      continue
                  if line.startswith("+") and not line.startswith("+++"):
                      return new_line
                  if not line.startswith("-"):
                      new_line += 1
              return None

          for entry in files:
              patch = entry.get("patch")
              if not patch:
                  continue
              line = first_added_line(patch)
              if line:
                  print(f'{entry["filename"]}|{line}')
                  break
          PY
          )"

          if [ -z "${ANCHOR}" ]; then
            echo "No addable line found to anchor a review comment to (pure deletions/binary/rename PR?)."
            echo "Falling back to a plain PR comment; this will NOT be gated by 'require conversation resolution'."
            gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "${BODY}"
            exit 0
          fi

          ANCHOR_PATH="${ANCHOR%%|*}"
          ANCHOR_LINE="${ANCHOR##*|}"

          echo "Anchoring warning to ${ANCHOR_PATH}:${ANCHOR_LINE}"

          gh api "repos/${REPO}/pulls/${PR_NUMBER}/comments" \
            -f body="${BODY}" \
            -f commit_id="${HEAD_SHA}" \
            -f path="${ANCHOR_PATH}" \
            -F line="${ANCHOR_LINE}" \
            -f side="RIGHT" \
            > /dev/null

          echo "Posted resolvable review comment on ${ANCHOR_PATH}:${ANCHOR_LINE}."
